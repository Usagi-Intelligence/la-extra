<!-- ═══ MODAL: Borrar Datos ═══ -->
<div class="modal-overlay" id="modal-borrar-datos" style="display:none; position:fixed; inset:0; z-index:9999; align-items:center; justify-content:center; background:rgba(0,0,0,0.55); backdrop-filter:blur(4px);">
  <div class="modal" style="max-width:420px; background:var(--bg-white, #fff); border:2px solid var(--bg-cool-gray); border-left:8px solid #e74c3c; border-radius:8px; padding:24px 28px; box-shadow:0 8px 40px rgba(0,0,0,0.18); animation:slideUp 0.2s cubic-bezier(.4,1.2,.6,1) both;">
    <div class="modal-header" style="margin-bottom:16px;">
      <h2 style="font-family:var(--font-head); font-size:1.15rem; font-weight:700; color:var(--text-dark); letter-spacing:0.04em; margin:0;">// ELIMINACIÓN DE DATOS</h2>
    </div>
    
    <div class="modal-body" style="display:flex; flex-direction:column; gap:16px;">
      <p style="font-family:var(--font-body); font-size:0.85rem; color:var(--text-muted); line-height:1.45; margin:0;">
        Seleccioná los datos que querés borrar permanentemente:
      </p>
      
      <div style="display:flex; flex-direction:column; gap:12px;">
        <label class="del-checkbox-label">
          <input type="checkbox" id="del-catalogo" class="del-checkbox">
          <span>Borrar catálogo completo</span>
        </label>
        <label class="del-checkbox-label">
          <input type="checkbox" id="del-pedidos" class="del-checkbox">

        </label>
      </div>

        <strong>¡ATENCIÓN!</strong> La eliminación de los datos seleccionados es permanente y no se puede deshacer.
      </div>
    </div>
    
    <div class="modal-footer" style="display:flex; gap:12px; justify-content:flex-end; align-items:center; margin-top:20px;">
      <button class="btn" onclick="closeBorrarDatosModal()" style="font-family:var(--font-header); font-weight:700; letter-spacing:0.04em; padding:8px 16px;">CANCELAR</button>
      
      <!-- Hold-to-confirm Button -->
      <button id="btn-confirm-delete" class="hold-btn">
        <span id="btn-confirm-text">ACEPTAR</span>
        <div id="btn-confirm-progress"></div>
      </button>
    </div>
  </div>
</div>
