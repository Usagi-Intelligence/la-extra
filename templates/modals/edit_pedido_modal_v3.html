<!-- ═══ MODAL: Edit Pedido ═══ -->
<div class="modal-overlay" id="modal-edit-pedido">
  <div class="modal" style="max-width:500px;">
    <div class="modal-header">
      <h2>// EDITAR PEDIDO</h2>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>Cliente</label>
          <input type="text" id="edit-ped-cliente">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" id="edit-ped-telefono">
        </div>
      </div>
      <div class="form-group">
        <label>Hora Retiro</label>
        <input type="time" id="edit-ped-hora">
      </div>
      <div class="form-group">
        <label>Método de Pago</label>
        <select id="edit-ped-pago">
          <option value="Mixto">Mixto</option>
          <option value="Efectivo">Efectivo</option>
          <option value="Transferencia">Transferencia</option>
          <option value="Crédito">Crédito</option>
          <option value="Débito">Débito</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeEditPedidoModal()">CANCELAR</button>
      <button class="btn btn-primary" onclick="submitEditPedido()">GUARDAR</button>
    </div>
  </div>
</div>
