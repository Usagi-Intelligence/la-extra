<!-- ═══ MODAL: Confirm ═══ -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal" style="max-width:380px;">
    <div class="modal-header">
      <h2 id="confirm-title">// CONFIRMAR</h2>
    </div>
    <div class="modal-body">
      <p id="confirm-text" style="font-family:var(--font-mono); font-size:0.85rem;"></p>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeConfirm()">CANCELAR</button>
      <button class="btn btn-primary" id="confirm-ok-btn">CONFIRMAR</button>
    </div>
  </div>
</div>
