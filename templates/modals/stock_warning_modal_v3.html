<!-- ═══ MODAL: Stock Insufficient Warning ═══ -->
<div class="modal-overlay" id="modal-stock-warning">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header" style="background: linear-gradient(180deg, #e67e22 0%, #d35400 100%);">
      <h2 id="stock-warning-title">// STOCK INSUFICIENTE</h2>
    </div>
    <div class="modal-body">
      <p id="stock-warning-text" style="font-family:var(--font-mono); font-size:0.85rem; line-height:1.5;"></p>
    </div>
    <div class="modal-footer">
      <button class="btn" id="stock-warning-undo-btn">DESHACER</button>
      <button class="btn btn-primary" id="stock-warning-ignore-btn" style="background: linear-gradient(180deg, #e67e22 0%, #d35400 100%); border-color: #d35400;">IGNORAR</button>
    </div>
  </div>
</div>
