    <!-- ── STOCK ──────────────────────────────────────── -->
    <section class="section" id="sec-stock">
      <div class="panel">
        <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
          <select id="stock-filter-product" onchange="onStockFilterChange()" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 2px 10px; font-family: var(--font-mono); font-size: 0.78rem; border-radius: 4px; outline: none; cursor: pointer; width: 220px;">
            <option value="" style="color: var(--text-dark);">Todos los productos</option>
          </select>
          <div class="window-controls">
            <button class="btn btn-sm" onclick="openStockModal()"
              style="background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.3); color:#fff; text-shadow:none; padding:3px 12px; white-space: nowrap;">
              + AGREGAR
            </button>
          </div>
        </div>
        <div class="panel-body">
          <div id="stock-list"><div class="loading">CARGANDO...</div></div>
        </div>
      </div>
    </section>
