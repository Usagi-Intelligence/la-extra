    <!-- ── GASTOS & STOCK ──────────────────────────────── -->
    <section class="section" id="sec-gastosstock">

      <!-- Sub-tabs principales -->
      <div class="sub-tabs" id="gs-main-tabs">
        <button class="sub-tab active" data-gs="stock" onclick="switchGsTab('stock')">📦 Control</button>
        <button class="sub-tab" data-gs="detalle" onclick="switchGsTab('detalle')">📊 Detalle</button>
      </div>

      <!-- ══ STOCK ══ -->
      <div id="gs-stock-section">
        <div class="panel">
          <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
            <select id="stock-filter-product" onchange="onStockFilterChange()" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 2px 10px; font-family: var(--font-mono); font-size: 0.78rem; border-radius: 4px; outline: none; cursor: pointer; width: 220px;">
              <option value="" style="color: var(--text-dark);">Todos los productos</option>
            </select>
            <div class="window-controls">
              <button class="btn btn-sm" onclick="openStockModal()"
                style="background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.3); color:#fff; text-shadow:none; padding:3px 12px; white-space: nowrap;">
                + AGREGAR
              </button>
            </div>
          </div>
          <div class="panel-body">
            <div id="stock-list"><div class="loading">CARGANDO...</div></div>
          </div>
        </div>
      </div>

      <!-- ══ DETALLE (PRODUCTOS MÁS VENDIDOS HOY) ══ -->
      <div id="gs-detalle-section" style="display:none;">
        <div class="panel">
          <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
            <span>PRODUCTOS VENDIDOS HOY</span>
            <select id="detalle-filter-categoria" onchange="onDetalleFilterChange()" style="background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #fff; padding: 2px 10px; font-family: var(--font-mono); font-size: 0.78rem; border-radius: 4px; outline: none; cursor: pointer; width: 220px;">
              <option value="" style="color: var(--text-dark);">Todas las categorías</option>
            </select>
          </div>
          <div class="panel-body" style="max-height: 400px; overflow-y: auto; padding: 0;">
            <div id="resumen-productos">
              <p style="color:var(--text-dim);font-family:var(--font-mono);font-size:0.82rem;padding:12px;">// SIN VENTAS HOY</p>
            </div>
          </div>
        </div>
      </div>

    </section>
